name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version to release (e.g. 1.0.0)
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare-release:
    name: Prepare release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.bump-version.outputs.version }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Configure Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Bump version
        id: bump-version
        run: |
          echo "version=$(pnpm version "${{ github.event.inputs.version }}")" >> $GITHUB_OUTPUT

      - name: Push changes and tags
        run: git push --follow-tags

  desktop-build:
    name: ${{ matrix.artifact }}
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mac
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    permissions:
      contents: write

    env:
      IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}

    steps:

      - name: Set release version
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          VERSION=${{ needs.prepare-release.outputs.version }}
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.IS_RELEASE == 'true' && env.APP_VERSION || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build:desktop

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v2
        if: startsWith(matrix.os, 'ubuntu') && env.IS_RELEASE == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.snapcraft_token }}

      - name: Prepare macOS notarization key
        if: startsWith(matrix.os, 'macos') && env.IS_RELEASE == 'true'
        run: |
          mkdir -p "$HOME/private_keys/"
          echo "$APPLE_API_KEY_CONTENT" > "$HOME/private_keys/AuthKey_${{ secrets.api_key_id }}.p8"
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey_${{ secrets.api_key_id }}.p8" >> $GITHUB_ENV
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.api_key }}

      - name: Package
        if: github.event_name != 'pull_request'
        run: pnpm run package -- --publish ${{ env.IS_RELEASE == 'true' && 'always' || 'never' }}
        working-directory: packages/tesler-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.mac_certs }}
          CSC_KEY_PASSWORD: ${{ secrets.mac_certs_password }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.api_key_id }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.api_key_issuer_id }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.snapcraft_token }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: ${{ needs.prepare-release.outputs.version == '' && matrix.artifact || format('{0}-{1}', matrix.artifact,needs.prepare-release.outputs.version) }}
          path: |
            packages/tesler-desktop/release/**/*.dmg
            packages/tesler-desktop/release/**/*.pkg
            packages/tesler-desktop/release/**/*.exe
            packages/tesler-desktop/release/**/*.AppImage
            packages/tesler-desktop/release/**/*.snap
            packages/tesler-desktop/release/**/*.deb
          if-no-files-found: ignore
          compression-level: 0

      - name: Print notarization error log
        if: failure() && startsWith(matrix.os, 'macos')
        run: cat notarization-error.log || true

  mobile-build:
    name: android-apk
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    env:
      IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
      # eas build --local needs this in CI: actions/checkout is a shallow clone,
      # which breaks eas-cli's git integration otherwise.
      EAS_NO_VCS: 1

    steps:
      - name: Set release version
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          VERSION=${{ needs.prepare-release.outputs.version }}
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.IS_RELEASE == 'true' && env.APP_VERSION || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install

      - name: Restore Android signing credentials
        if: github.event_name != 'pull_request'
        working-directory: packages/tesler-app
        run: |
          mkdir -p credentials
          echo "$ANDROID_CREDENTIALS_JSON_BASE64" | base64 -d > credentials.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > credentials/android-release.jks
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > credentials/google-service-account.json
        env:
          ANDROID_CREDENTIALS_JSON_BASE64: ${{ secrets.android_credentials_json_base64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.android_keystore_base64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.google_play_service_account_json_base64 }}

      - name: Build Android APK
        if: github.event_name != 'pull_request'
        run: pnpm build:android
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}

      - name: Build Android AAB
        if: github.event_name != 'pull_request'
        working-directory: packages/tesler-app
        run: pnpm build:aab
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: ${{ needs.prepare-release.outputs.version == '' && 'android' || format('android-{0}', needs.prepare-release.outputs.version) }}
          path: | 
            packages/tesler-app/*.apk 
            packages/tesler-app/*.aab
          if-no-files-found: ignore
          compression-level: 0

      - name: Submit Android AAB to Google Play
        if: github.event_name != 'pull_request'
        working-directory: packages/tesler-app
        run: |
          PROFILE="internal"
          if [ "$IS_RELEASE" = "true" ]; then PROFILE="production"; fi
          echo "Submitting to Google Play track: $PROFILE"
          npx eas-cli submit --platform android --profile "$PROFILE" --non-interactive --path ./tesler.aab
        env:
          EXPO_TOKEN: ${{ secrets.expo_token }}

  post-release:
    name: Post release
    needs: [desktop-build, mobile-build, prepare-release]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          tag: v${{ needs.prepare-release.outputs.version }}
          artifacts: |
            mac-${{ needs.prepare-release.outputs.version }}
            linux-${{ needs.prepare-release.outputs.version }}
            windows-${{ needs.prepare-release.outputs.version }}
            android-${{ needs.prepare-release.outputs.version }}

